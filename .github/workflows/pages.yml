name: Website

# Builds https://simulamet.github.io/Verdi/ from this branch's build.py and
# main's docs/*.md. Runs when this branch changes, or by hand after docs on
# main change:  gh workflow run pages.yml --ref website
on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build site
        run: |
          pip install markdown
          python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
