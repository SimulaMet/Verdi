name: Publish to PyPI

# Runs only when a GitHub Release is published (not on push or PR).
# Release flow: bump `version` in pyproject.toml and src/verdi_agents/__init__.py,
# merge, then publish a release tagged v<version> (e.g. v0.1.1).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" build twine
      - name: Tag must match package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(python -c "import verdi_agents; print(verdi_agents.__version__)")
          echo "tag=$tag pyproject=$pkg verdi_agents.__version__=$mod"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$mod" ]; then
            echo "::error::Release tag v$tag does not match pyproject ($pkg) / __version__ ($mod)"
            exit 1
          fi
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: python -m pytest
      - name: Build
        run: python -m build
      - name: Check distributions
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no API token stored in GitHub. Requires a
    # trusted publisher on PyPI for SimulaMet/Verdi, workflow pypi.yml,
    # environment "pypi".
    environment:
      name: pypi
      url: https://pypi.org/project/verdi-agents/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
