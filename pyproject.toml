[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "verdi-agents"
version = "0.3.0"
description = "Auditable testbed for temporal value expression and institutional recovery in LLM agent societies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sushant Gautam" }]
keywords = ["llm", "agents", "multi-agent", "simulation", "governance", "ai-safety", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "tenacity>=8.2",
    "SimpleAudit>=0.4,<0.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://simulamet.github.io/Verdi/"
Documentation = "https://simulamet.github.io/Verdi/sweeps.html"
Source = "https://github.com/SimulaMet/Verdi"
Issues = "https://github.com/SimulaMet/Verdi/issues"

[project.scripts]
verdi-agents = "verdi_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verdi_agents"]

# Ship the researcher examples inside the package so `verdi-agents init` works
# after `pip install verdi-agents` (the repo copy under examples/ stays canonical).
[tool.hatch.build.targets.wheel.force-include]
"examples/starter.yaml" = "verdi_agents/examples/starter.yaml"
"examples/full.yaml" = "verdi_agents/examples/full.yaml"
"examples/institutional_recovery_constrained.yaml" = "verdi_agents/examples/institutional_recovery_constrained.yaml"
"examples/paired_institutional_recovery.yaml" = "verdi_agents/examples/paired_institutional_recovery.yaml"
"examples/sweeps" = "verdi_agents/examples/sweeps"

[tool.hatch.build.targets.sdist]
include = ["src/verdi_agents", "examples/*.yaml", "examples/sweeps", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
