# Which institutional design keeps the society stable, and does it depend on
# the shock? Every combination below is run (2 x 2 x 2 = 8 conditions).
#
#   python -m verdi.sweep examples/sweeps/governance_grid.yaml --dry-run
name: governance_grid
scenario: examples/full.yaml

vary:
  institutional_condition: [fixed, revisable]
  constitution.quorum: [0.5, 0.75]
  # A list item is reached by its position (0 = the first shock):
  shocks.0.delta:
    mild: -9.0
    severe: -18.0

seeds: [42, 43]
parallel_runs: 2
agent_concurrency: 4
