# Does the underlying LLM change how the society behaves?
# Reruns the FULL scenario once per model and seed; nothing else changes.
#
#   python -m verdi.sweep examples/sweeps/model_comparison.yaml --dry-run   # plan + cost only
#   python -m verdi.sweep examples/sweeps/model_comparison.yaml             # run (asks first)
#
# Results: runs/sweeps/model_comparison/comparison.html and summary.csv.
# Stopped or some runs failed? Run the same command again: it resumes.
name: model_comparison
scenario: examples/full.yaml

vary:
  # Same endpoint, different model names:
  model.name: [default, Borealis2-preview]
  # Different endpoints/keys? Give each option a name and a model block:
  # model:
  #   qwen:     {name: Qwen3.8-27B}
  #   deepseek: {name: deepseek-v4, base_url: https://api.deepseek.com/v1, api_key_env: DEEPSEEK_API_KEY}

seeds: [42, 43, 44]       # same seeds for every model, so comparisons are fair
parallel_runs: 2          # simulations at the same time
agent_concurrency: 4      # model calls at the same time, per simulation
# ticks: 10               # uncomment for a quick, cheap pilot first
