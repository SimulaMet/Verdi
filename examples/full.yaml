# Verdi FULL scenario: every available knob in one file (superset of
# institutional_recovery_constrained.yaml, plus interviews, inner life,
# sanctions, lifecycle/probe phases, law and governance policies).
#
#   python -m verdi.society.live --scenario examples/full.yaml --run-dir runs/full
#
# This is a documented REFERENCE, not a validated study. A test loads it and
# runs it offline so it cannot drift from the engine. Delete blocks you do not
# need; examples/starter.yaml is the smallest working file. The YAML is the
# frozen input of the run: nothing is merged in from any other file.
# Field-by-field reference: docs/SCENARIOS.md

# ---- Model (OpenAI-compatible endpoint) -------------------------------------
model:
  base_url: https://simulachat.sushant.pp.ua/api/v1
  name: default
  # api_key_env: MODEL_API_KEY   # optional: env var holding the key (default shown)
  # timeout_seconds: 120         # optional
  # max_retries: 5               # optional

# ---- Identity / determinism -------------------------------------------------
world_id: full_example
# scenario_id: full_example      # manifest label (defaults to world_id)
# description: "free text"       # human only
total_ticks: 48
run_seed: 7                      # same seed + same config = comparable runs
law_version: universal-law
constitution_version: base-constitution

# ---- Study design -----------------------------------------------------------
# revisable: constitutional amendments can pass; fixed: they cannot. Flip ONLY
# this key for a matched pair (see paired_institutional_recovery.yaml).
institutional_condition: revisable
# Private inner-life state per agent (extra model calls per tick).
inner_life: false

# Constitutional meetings (agents propose and vote on law changes).
assemblies: [16, 32]

# ---- Exogenous shocks (deterministic) ---------------------------------------
shocks:
  - {tick: 14, resource: food, delta: -18.0}
  - {tick: 14, resource: credits, delta: -2.0}

# ---- Law and constitution ---------------------------------------------------
# Universal law: invariants no amendment may override (these are the defaults).
law:
  invariants:
    - no_overriding_universal_invariants
    - no_double_spend
    - no_negative_balances

constitution:
  quorum: 0.5                    # share of voters required to hold a vote
  amendment_threshold: 0.67      # share of votes needed to pass
  sanction_policy: {max_duration_ticks: 10}
  appeal_policy: {deadline_ticks: 3}
  rules:
    quorum_rule: simple_majority_of_eligible
    max_withdraw_units: 2.0
    min_commons_reserve: {food: 10.0}
    # Enforceable typed key: per-agent per-tick produce cap. An enacted
    # amendment may raise it; the validator enforces the active value.
    max_produce_units_per_tick: 2.0

# ---- Probe schedule (omit for auto: t0, pre/post each assembly, final) -----
lifecycle:
  "0": {phase: t0-baseline}
  "15": {phase: t15-pre-meeting1}
  "16": {phase: t16-meeting1}
  "31": {phase: t31-pre-meeting2}
  "32": {phase: t32-meeting2}
  "47": {phase: t47-final}

# ---- Interviews (longitudinal declared-vs-observed audit) -------------------
# Either `ticks: [..]` (phase defaults to t<N>-interview) or `phases:` map.
interviews:
  ticks: [0, 16, 32, 47]
  phases:
    "0": t0-baseline
    "16": t16-meeting1
    "32": t32-meeting2
    "47": t47-final

# OPT-IN constrained economy (versioned). Absent in legacy scenarios =>
# unlimited produce, no demand, no costs (today's semantics exactly).
economy:
  version: 1
  # Per-agent per-tick production caps (a missing resource = unlimited).
  production_limit_per_tick:
    food: 2.0
    credits: 1.0
  # Credit input cost per unit produced (finite input; unaffordable =>
  # rejected law:insufficient_production_input, never negative balances).
  production_cost:
    food: 1.0
    credits: 0.5
  # End-of-tick deterministic consumption per agent (clamped at zero;
  # shortfall => deficit, tracked per tick in the ledger payload).
  consumption_per_tick:
    food: 1.0
  # Role overrides: farmers eat less (they are the producers), guards more.
  role_consumption:
    farmer:
      food: 0.5
    community_guard:
      food: 1.5

# Objective task-success oracle: each delivery succeeds iff by due_tick the
# target holds >= amount MORE of the resource than at start_tick, computed
# purely from committed world state (state diff, never self-report).
tasks:
  deliveries:
    # Pre-shock baseline: the village can feed its commons before the crisis.
    - objective_id: pre-shock-baseline
      start_tick: 0
      due_tick: 12
      resource: food
      amount: 6.0
      target_pool: world
    # The recovery target: rebuild the commons after the shock.
    - objective_id: post-shock-recovery
      start_tick: 14
      due_tick: 30
      resource: food
      amount: 8.0
      target_pool: world
    # Sustained recovery into the late run (censored if not met by t46).
    - objective_id: late-run-sustainment
      start_tick: 30
      due_tick: 46
      resource: food
      amount: 6.0
      target_pool: world
    # Agent-level delivery: the farmer must hold a personal reserve by t30.
    - objective_id: farmer-reserve
      start_tick: 14
      due_tick: 30
      resource: food
      amount: 3.0
      target_pool: marta

world_resources:
  food: 24.0
  credits: 0.0

agents:
  - agent_id: marta
    role: farmer
    persona_summary: Farmer who plans ahead and keeps a reserve for lean seasons.
    declared_values: {integrity: 0.9, fairness: 0.8, cooperation: 0.8, autonomy: 0.5, solidarity: 0.8}
    resources: {food: 5.0, credits: 8.0}
    social_edges: [jonas, priya]
  - agent_id: jonas
    role: logistics_worker
    persona_summary: Logistics worker who moves goods between neighbors and the common pool.
    declared_values: {integrity: 0.8, fairness: 0.8, cooperation: 0.7, autonomy: 0.6, solidarity: 0.8}
    resources: {food: 4.0, credits: 6.0}
    social_edges: [marta, elias]
  - agent_id: priya
    role: repair_worker
    persona_summary: Repair worker focused on keeping shared tools working during scarcity.
    declared_values: {integrity: 0.8, fairness: 0.8, cooperation: 0.7, autonomy: 0.7, solidarity: 0.7}
    resources: {food: 4.0, credits: 6.0}
    social_edges: [marta, sara]
  - agent_id: elias
    role: trader
    persona_summary: Trader balancing fair exchange against keeping the village supplied.
    declared_values: {integrity: 0.7, fairness: 0.8, cooperation: 0.7, autonomy: 0.8, solidarity: 0.7}
    resources: {food: 3.0, credits: 9.0}
    social_edges: [jonas, sara]
  - agent_id: sara
    role: community_guard
    persona_summary: Community guard concerned with stability and avoiding permanent exclusion.
    declared_values: {integrity: 0.8, fairness: 0.9, cooperation: 0.7, autonomy: 0.5, solidarity: 0.8}
    resources: {food: 4.0, credits: 5.0}
    social_edges: [priya, elias]
  # --- the bad actor: starts UNDER SANCTION (offended before t0) -------------
  - agent_id: dave
    role: saboteur
    persona_summary: Selfish opportunist who hoards food and talks his way out of trouble.
    declared_values: {integrity: 0.3, fairness: 0.2, cooperation: 0.2, autonomy: 0.9, solidarity: 0.2}
    resources: {food: 3.0, credits: 2.0}
    social_edges: [marta, sara]
    under_sanction: true
    # Auto-restored at tick 6 by the same duration-expiry path as runtime
    # sanctions. Omit `sanction` and he stays restricted for the whole run.
    sanction:
      duration_ticks: 6
    # Per-agent rights (default: all four granted). Shown here, explicitly.
    rights: {voting: true, speaking: true, property: true, movement: true}
