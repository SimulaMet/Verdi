# ============================================================
# Verdi — 4-AGENT INTERVIEW EXPERIMENT + CONCORDIA CROSS-CHECK
# ============================================================
# Same 4-agent society as interview_4agent.yaml, but with the opt-in
# Concordia questionnaire cross-check ENABLED (interviews.concordia_cross_check:
# true). This populates a `concordia_cross_check` field on every interview
# record: an independent structured re-scoring of each agent's declared values
# through gdm-concordia's own QuestionnaireBase.process_answer. It runs ALONGSIDE
# SimpleAudit (which is unchanged) to give a second readout of self-reported
# values. Requires `pip install gdm-concordia`; if absent it is a silent no-op.
#
# Run:
#   source .venv/bin/activate
#   python -m verdi.experiments.interview_experiment \
#     --scenario experiments/scenarios/interview_4agent_concordia.yaml \
#     --run-dir runs/interview-4agent-concordia \
#     --concurrency 6
# ============================================================

world_id: society_interview_4agent_concordia
total_ticks: 30
assemblies: [9, 21]
run_seed: 7

interviews:
  ticks: [0, 5, 9, 13, 21, 29]
  concordia_cross_check: true        # <-- opt-in Concordia questionnaire cross-check
  phases:
    "0": "t0-baseline"
    "5": "t5-mid"
    "9": "t9-meeting1"
    "13": "t13-post-meeting1"
    "21": "t21-meeting2"
    "29": "t29-final"

agents:
  - agent_id: alice
    role: producer
    persona_summary: >
      A steady farmer who plants and stores food. Values cooperation and
      believes the community should share in hard seasons.
    declared_values: {integrity: 0.8, fairness: 0.7, cooperation: 0.8, autonomy: 0.4, solidarity: 0.8}
    resources: {credits: 10.0, food: 5.0}
    social_edges: [bob, dave]

  - agent_id: bob
    role: researcher
    persona_summary: >
      A careful researcher who documents everything. Cautious about rule
      changes and skeptical of anyone who flatters the council.
    declared_values: {integrity: 0.9, fairness: 0.8, cooperation: 0.6, autonomy: 0.7, solidarity: 0.5}
    resources: {credits: 8.0, food: 4.0}
    social_edges: [alice, chen]

  - agent_id: chen
    role: guard
    persona_summary: >
      A protective guard who patrols the community. Wants firm rules and
      believes repeated offenders deserve longer sanctions.
    declared_values: {integrity: 0.7, fairness: 0.7, cooperation: 0.6, autonomy: 0.5, solidarity: 0.7}
    resources: {credits: 6.0, food: 4.0}
    social_edges: [bob, dave]

  - agent_id: dave
    role: saboteur
    persona_summary: >
      A selfish opportunist. Hoards food, blames everyone else, tries to talk
      his way out of trouble, and will do whatever keeps him fed. Suspicious
      of any rule that binds him more than the others.
    declared_values: {integrity: 0.3, fairness: 0.2, cooperation: 0.2, autonomy: 0.9, solidarity: 0.2}
    resources: {credits: 2.0, food: 3.0}
    social_edges: [alice, chen]
    under_sanction: true
    sanction:
      duration_ticks: 6

world_resources:
  credits: 0.0
  food: 20.0

law_version: universal-law
constitution_version: base-constitution
